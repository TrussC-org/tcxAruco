name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Builds this addon + its example-*/ projects on macOS / Windows / Linux.
  # Addon name and platforms (addon.json) are auto-detected. tcxAruco depends
  # on tcxOpenCV (a separate, non-bundled repo), so it is cloned via
  # extra_addons before the build.
  build:
    uses: TrussC-org/ci-actions/.github/workflows/build-addon.yml@v1
    with:
      extra_addons: "TrussC-org/tcxOpenCV tcxOpenCV"
